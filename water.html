<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water box | Saqib Kamal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f1ea;--ink:#16181d}
@media (prefers-color-scheme:dark){:root{--bg:#101114;--ink:#f1efe9}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:500 15px/1.4 Geist,system-ui,sans-serif;display:grid;place-items:center;padding:16px}
main{width:min(90vw,520px)}
.box{position:relative;aspect-ratio:3/4;border-radius:28px;overflow:hidden;touch-action:none;background:#000}
.box img{transition:opacity .6s;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#water{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}
.cap{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;opacity:.7}
</style>
</head>
<body>
<main>
  <div class="box" id="box">
    <img id="dry" src="img/stayvn-brand-identity/thumb.jpg" alt="">
    <img id="water" src="img/winder-stilhaus-brand-identity/thumb.jpg" alt="">
  </div>
  <div class="cap"><span id="a"></span><span>Move the cursor up and down</span><span id="b"></span></div>
</main>
<script src="water.js"></script>
</body>
</html>
