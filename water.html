<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water box | Saqib Kamal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f1ea;--ink:#16181d}
@media (prefers-color-scheme:dark){:root{--bg:#101114;--ink:#f1efe9}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:500 15px/1.4 Geist,system-ui,sans-serif;display:grid;place-items:center;padding:16px}
main{width:min(90vw,720px)}
.box{position:relative;aspect-ratio:4/3;overflow:hidden;touch-action:none;background:#000}
.box img{transition:opacity .6s;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#water{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}
.cap{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;opacity:.7}
</style>
</head>
<body>
<main>
  <div class="box" id="box">
    <img id="dry" src="img/stayvn-brand-identity/thumb.jpg" alt="">
    <img id="water" src="img/winder-stilhaus-brand-identity/thumb.jpg" alt="">
  </div>
  <div class="cap"><span id="a"></span><span>Move the cursor up and down</span><span id="b"></span></div>
</main>
<script>
const box=document.getElementById("box"),w=document.getElementById("water");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let target=.5,level=.5,t=0;
// Cursor above the box = full water, below = empty, in between follows the cursor.
const track=y=>{const r=box.getBoundingClientRect();target=Math.min(1,Math.max(0,(r.bottom-y)/r.height+.0))};
addEventListener("pointermove",e=>{track(e.clientY);if(reduce)draw()});
function draw(){
  level+=(target-level)*(reduce?1:.07); t+=.035;
  const top=(1-level)*100, amp=level<.02||level>.98?0:3.2, p=[];   // flat when fully empty or full
  for(let i=0;i<=24;i++){const x=i*100/24;p.push(`${x}% ${top+amp*(Math.sin(x/9+t)+.5*Math.sin(x/4.5-t*1.4))}%`)}
  w.style.clipPath=`polygon(${p.join(",")},100% 100%,0 100%)`;
  if(!reduce)requestAnimationFrame(draw)
}
draw();
// Works shown inside the box; the water and the empty side advance together every few seconds.
const WORKS=[["winder-stilhaus-brand-identity","Winder & Stilhaus"],["stayvn-brand-identity","Stayvn"],["ultra-natif-skincare-brand-identity","Ultra Natif"],["noara-labs-brand-identity","Noara Labs"],["spice-web-media-brand-identity","SpiceWeb"],["universal-hr-brand-identity","Universal HR"],["stratanova-brand-identity","StrataNova"],["bambu-eco-friendly-daily-essentials-brand-identity","Bambu"],["searchlight-digital-brand-identity","Searchlight"],["artix-ai-agency-brand-identity","Artix"]];
const dry=document.getElementById("dry"),A=document.getElementById("a"),B=document.getElementById("b");
let n=0;
function setWorks(){
  const [ws,wn]=WORKS[n%WORKS.length],[ds,dn]=WORKS[(n+1)%WORKS.length];
  [[w,ws],[dry,ds]].forEach(([el,s])=>{const src=`img/${s}/thumb.jpg`,i=new Image();i.onload=()=>{el.style.opacity=0;setTimeout(()=>{el.src=src;el.style.opacity=1},300)};i.src=src});
  A.textContent=wn;B.textContent=dn;
}
setWorks();
if(!reduce)setInterval(()=>{n++;setWorks()},4500);

// Wavy outline: a rounded rectangle (superellipse) with a sine ripple along its edge, built once.
(()=>{const N=240,p=[];for(let i=0;i<N;i++){const a=i/N*2*Math.PI,c=Math.cos(a),s=Math.sin(a),k=.5,
  r=1-.022*(1+Math.sin(a*14))/2;   // ripple depth 2.2%, 14 waves around
  p.push(`${50+50*r*Math.sign(c)*Math.abs(c)**(2/4.5)}% ${50+50*r*Math.sign(s)*Math.abs(s)**(2/4.5)}%`)}
  box.style.clipPath=`polygon(${p.join(",")})`})();
</script>
</body>
</html>
